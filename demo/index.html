<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设计台 · 展示版</title>
    <meta name="description" content="设计台：个人品牌设计工作流。需求 → 创意发散 → 视觉风格 → 出稿 → 评审 → 交付。展示版不保存任何数据。" />
    <link rel="icon" href="./favicon.svg" />
    <script>try{var t=localStorage.getItem("dd-theme");if(t!=="dark"&&t!=="light"){t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="./app.js"></script>
  </body>
</html>
